<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sua oportunidade</title>
<style>
  :root{
    --bg:#0E1014;
    --panel:#171A21;
    --panel-2:#1F242E;
    --line:#2A303C;
    --accent:#FFB020;
    --accent-ink:#0E1014;
    --alert:#E23E57;
    --text:#F2F4F7;
    --muted:#9AA3B2;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.45;
    min-height:100dvh;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{width:100%;max-width:480px;margin:0 auto;padding:18px 16px 28px;flex:1;display:flex;flex-direction:column}

  /* topo */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .brand{font-weight:800;letter-spacing:.5px;font-size:15px}
  .brand span{color:var(--accent)}
  .counter{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* barra segmentada = etapas reais */
  .bars{display:flex;gap:5px;margin-bottom:26px}
  .bars i{flex:1;height:4px;border-radius:2px;background:var(--line);display:block;transition:background .25s ease}
  .bars i.on{background:var(--accent)}

  /* telas */
  .screen{display:none;flex:1;flex-direction:column}
  .screen.active{display:flex;animation:in .22s ease both}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .eyebrow{font-size:13px;color:var(--accent);font-weight:700;margin:0 0 8px}
  h1{font-size:26px;line-height:1.2;font-weight:800;margin:0 0 10px;letter-spacing:-.4px}
  h2{font-size:23px;line-height:1.22;font-weight:800;margin:0 0 10px;letter-spacing:-.3px}
  .sub{color:var(--muted);font-size:15px;margin:0 0 22px}

  /* opções */
  .opts{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .opt{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);
    color:var(--text);font:inherit;font-weight:600;
    padding:16px 14px;border-radius:var(--radius);cursor:pointer;
    transition:border-color .18s ease,background .18s ease,transform .1s ease;
  }
  .opt:hover{border-color:#3A4252}
  .opt:active{transform:scale(.99)}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .opt.sel{border-color:var(--accent);border-left-color:var(--accent);background:var(--panel-2)}
  .opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid #3A4252;flex:0 0 20px;position:relative}
  .opt.sel .dot{border-color:var(--accent)}
  .opt.sel .dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}

  /* botões */
  .cta{
    display:block;width:100%;border:0;cursor:pointer;text-decoration:none;text-align:center;
    background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:800;font-size:17px;
    padding:17px 16px;border-radius:40px;margin-top:22px;
  }
  .cta:active{transform:scale(.99)}
  .cta:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:600;font-size:14px;padding:13px;border-radius:40px;margin-top:10px;width:100%;cursor:pointer}
  .back{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;padding:10px 0;cursor:pointer;margin-top:auto;align-self:flex-start}

  .screen.final{justify-content:center}
  .screen.final .cta{margin-top:0}

  /* bloqueio */
  .blocked h2{color:var(--alert)}

  /* rodapé legal */
  .legal{margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
  .age{display:inline-block;background:var(--alert);color:#fff;font-size:11px;font-weight:800;padding:5px 10px;border-radius:6px;margin-bottom:8px}
  .legal p{font-size:11px;line-height:1.5;color:#6E7686;margin:0 0 6px}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">SUA<span>MARCA</span></div>
    <div class="counter" id="counter"></div>
  </div>
  <div class="bars" id="bars"></div>

  <div id="app"></div>

  <div class="legal">
    <span class="age">+18</span>
    <p>Conteúdo destinado exclusivamente a maiores de 18 anos. Proibido para menores.</p>
    <p>Resultados variam de pessoa para pessoa e não há garantia de ganho. Jogue com responsabilidade e nunca aposte valores que comprometam o seu orçamento.</p>
  </div>

</div>

<script>
/* ==========================================================
   CONFIGURAÇÃO — edite só este bloco
   ========================================================== */
const CONFIG = {
  ctaUrl: "https://lp-google.onrender.com/",   // link de destino
  ctaText: "Acessar oferta",
  passUtms: true                     // repassa utms + query string para o link final
};

/* ETAPAS — a primeira é o gate de idade. Adicione/remova à vontade. */
const STEPS = [
  {
    id: "idade",
    gate: true,
    eyebrow: "Antes de começar",
    title: "Você tem 18 anos ou mais?",
    sub: "Só podemos liberar o conteúdo para maiores de idade.",
    options: [
      { label: "Sim, tenho 18 anos ou mais", value: "sim" },
      { label: "Não, sou menor de 18", value: "nao", block: true }
    ]
  },
  {
    id: "motivo",
    eyebrow: "Etapa 1",
    title: "O que faria mais diferença na sua vida hoje?",
    sub: "Escolha o que estiver mais perto da sua realidade.",
    options: [
      { label: "Colocar as contas em dia", value: "contas" },
      { label: "Guardar uma reserva", value: "reserva" },
      { label: "Realizar um objetivo parado há tempo", value: "objetivo" },
      { label: "Depender menos do salário", value: "liberdade" }
    ]
  },
  {
    id: "primeiro_passo",
    eyebrow: "Etapa 2",
    title: "Se caísse R$ 1.000 na sua conta agora, o que você faria primeiro?",
    options: [
      { label: "Guardaria tudo", value: "guardar" },
      { label: "Pagaria o que está atrasado", value: "pagar" },
      { label: "Usaria uma parte para tentar multiplicar", value: "multiplicar" },
      { label: "Iria com tudo atrás de mais", value: "tudo" }
    ]
  },
  {
    id: "valor",
    eyebrow: "Etapa 3",
    title: "Com quanto você começaria hoje, sem apertar o orçamento?",
    sub: "Não existe resposta certa. Isso define o ritmo que faz sentido para você.",
    options: [
      { label: "Até R$ 50", value: "ate50" },
      { label: "Entre R$ 50 e R$ 150", value: "50a150" },
      { label: "Entre R$ 150 e R$ 500", value: "150a500" },
      { label: "Mais de R$ 500", value: "500mais" }
    ]
  },
  {
    id: "tempo",
    eyebrow: "Etapa 4",
    title: "Quanto tempo por dia você tem livre?",
    options: [
      { label: "Menos de 30 minutos", value: "30min" },
      { label: "Cerca de 1 hora", value: "1h" },
      { label: "De 2 a 3 horas", value: "2a3h" },
      { label: "O tempo que for preciso", value: "livre" }
    ]
  },
  {
    id: "trava",
    eyebrow: "Etapa 5",
    title: "O que mais te trava quando o assunto é ganhar dinheiro fora do salário?",
    options: [
      { label: "Medo de perder o que já tenho", value: "medo" },
      { label: "Não saber por onde começar", value: "comeco" },
      { label: "Já tentei antes e não deu certo", value: "tentei" },
      { label: "Nada me trava, só falta a chance", value: "nada" }
    ]
  }
];

/* ==========================================================
   MOTOR DO QUIZ
   ========================================================== */
const app = document.getElementById("app");
const bars = document.getElementById("bars");
const counter = document.getElementById("counter");
const answers = {};
let idx = 0;

const totalTelas = STEPS.length;

function track(event, data) {
  try { if (window.fbq) fbq("trackCustom", event, data || {}); } catch (e) {}
  try { window.dataLayer = window.dataLayer || []; dataLayer.push({ event: event, ...data }); } catch (e) {}
}

function buildBars() {
  bars.innerHTML = "";
  for (let i = 0; i < totalTelas; i++) bars.appendChild(document.createElement("i"));
}
function paintBars(n) {
  [...bars.children].forEach((el, i) => el.classList.toggle("on", i <= n));
  counter.textContent = Math.min(n + 1, totalTelas) + " de " + totalTelas;
}
function show(html, cls) {
  app.innerHTML = '<div class="screen active ' + (cls || "") + '">' + html + "</div>";
  window.scrollTo(0, 0);
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function renderStep() {
  const step = STEPS[idx];
  paintBars(idx);

  const opts = step.options.map((o, i) =>
    '<button class="opt" data-i="' + i + '"><span class="dot"></span><span>' + esc(o.label) + "</span></button>"
  ).join("");

  show(
    (step.eyebrow ? '<p class="eyebrow">' + esc(step.eyebrow) + "</p>" : "") +
    "<h2>" + esc(step.title) + "</h2>" +
    (step.sub ? '<p class="sub">' + esc(step.sub) + "</p>" : "") +
    '<div class="opts">' + opts + "</div>" +
    (idx > 0 ? '<button class="back" id="back">Voltar</button>' : "")
  );

  app.querySelectorAll(".opt").forEach(btn => {
    btn.addEventListener("click", () => {
      const opt = step.options[+btn.dataset.i];
      app.querySelectorAll(".opt").forEach(b => b.classList.remove("sel"));
      btn.classList.add("sel");
      answers[step.id] = opt.value;
      track("QuizStep", { step: idx + 1, id: step.id, answer: opt.value });

      setTimeout(() => {
        if (opt.block) return renderBlocked();
        idx++;
        if (idx < STEPS.length) renderStep();
        else renderFinal();
      }, 220);
    });
  });

  const back = document.getElementById("back");
  if (back) back.addEventListener("click", () => { idx--; renderStep(); });
}

function renderBlocked() {
  paintBars(-1);
  show(
    "<h2>Este conteúdo é só para maiores de 18 anos</h2>" +
    '<p class="sub">Não podemos continuar. Volte quando tiver 18 anos ou mais.</p>' +
    '<button class="ghost" id="again">Respondi errado, voltar</button>',
    "blocked"
  );
  track("QuizBlockedUnder18", {});
  document.getElementById("again").addEventListener("click", () => { idx = 0; renderStep(); });
}

function buildUrl() {
  let url = CONFIG.ctaUrl;
  if (CONFIG.passUtms && location.search.length > 1) {
    url += (url.includes("?") ? "&" : "?") + location.search.slice(1);
  }
  return url;
}

function renderFinal() {
  paintBars(totalTelas);
  show('<a class="cta" id="go" href="' + buildUrl() + '" rel="nofollow noopener">' + esc(CONFIG.ctaText) + "</a>", "final");
  track("QuizComplete", {});
  document.getElementById("go").addEventListener("click", () => track("QuizCTAClick", {}));
}

buildBars();
renderStep();
</script>
</body>
</html>
