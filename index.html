<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Descubra seu perfil</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;padding:20px;
    font-family:Inter,Arial,Helvetica,sans-serif;
    background:#ffffff;
  }
  .card{
    width:100%;max-width:380px;
    background:#ffffff;
    border:1px solid #E6EAF0;
    border-radius:18px;
    padding:30px 26px 26px;
    box-shadow:0 10px 34px rgba(16,24,40,.07);
    text-align:center;
  }
  h1{
    font-size:23px;line-height:1.25;font-weight:800;color:#172033;
    margin:0 0 22px;
  }
  .opt{
    display:block;width:100%;
    background:#F5D14E;color:#172033;
    border:0;border-radius:11px;
    font-family:inherit;font-size:16px;font-weight:600;
    padding:16px 14px;margin-bottom:14px;cursor:pointer;
    transition:background .15s ease,transform .1s ease;
  }
  .opt:last-child{margin-bottom:0}
  .opt:hover{background:#F8DC72}
  .opt:active{transform:scale(.985)}
  .opt:focus-visible{outline:3px solid #172033;outline-offset:2px}
  .msg{font-size:15px;line-height:1.5;color:#667085;margin:0}
</style>
</head>
<body>

<main class="card">
  <h1 id="pergunta"></h1>
  <div id="opcoes"></div>
</main>

<script>
/* ==========================================================
   CONFIGURAÇÃO
   ========================================================== */
const DESTINO = "https://lp-google.onrender.com/";
const PASSA_UTM = true;

const SUPABASE = {
  ativo: true,
  url:   "https://wkweqhszjujvevnbhhzg.supabase.co",
  anon:  "sb_publishable_0QsDv6tagm5DUVbuf8IXBQ_HSGhI_Mg",
  tabela:"quiz_eventos"
};

/* bloqueia: encerra o quiz  |  avanca: manda para o destino */
const PERGUNTAS = [
  {
    q:"Você tem mais de 18 anos?",
    a:[ {t:"Sim"}, {t:"Não", bloqueia:true} ]
  },
  {
    q:"Você gosta de se divertir online e receber vários benefícios?",
    a:[ {t:"Sim"}, {t:"Mais ou menos"} ]
  },
  {
    q:"Se você tivesse um ganho alto hoje, o que faria?",
    a:[
      {t:"Colocaria as contas em dia"},
      {t:"Guardaria uma parte"},
      {t:"Realizaria um sonho antigo"},
      {t:"Aproveitaria o momento"}
    ]
  },
  {
    q:"Você gosta de novidades e promoções quentes?",
    a:[ {t:"Sim", avanca:true}, {t:"Quero entender melhor", avanca:true} ]
  }
];

/* ==========================================================
   COLETA
   ========================================================== */
const SESSAO = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());

function registrar(evento, dados){
  if(!SUPABASE.ativo) return;
  try{
    fetch(SUPABASE.url + "/rest/v1/" + SUPABASE.tabela, {
      method:"POST", keepalive:true,
      headers:{
        "apikey": SUPABASE.anon,
        "Authorization": "Bearer " + SUPABASE.anon,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({
        sessao: SESSAO,
        evento: evento,
        etapa: (dados && dados.etapa) || null,
        pergunta: (dados && dados.pergunta) || null,
        resposta: (dados && dados.resposta) || null,
        utms: location.search.slice(1) || null
      })
    }).catch(()=>{});
  }catch(e){}
}

function track(ev, data){
  try{ if(window.fbq) fbq("trackCustom", ev, data || {}); }catch(e){}
  try{ window.dataLayer = window.dataLayer || []; dataLayer.push({event:ev, ...(data||{})}); }catch(e){}
}

/* ==========================================================
   QUIZ
   ========================================================== */
const elP = document.getElementById("pergunta");
const elO = document.getElementById("opcoes");
let i = 0;

function destino(){
  let url = DESTINO;
  if(PASSA_UTM && location.search.length > 1){
    url += (url.includes("?") ? "&" : "?") + location.search.slice(1);
  }
  return url;
}

function render(){
  const p = PERGUNTAS[i];
  elP.textContent = p.q;
  elO.innerHTML = "";

  p.a.forEach(opt=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt";
    b.textContent = opt.t;
    b.addEventListener("click", ()=> escolher(opt));
    elO.appendChild(b);
  });
}

function escolher(opt){
  const p = PERGUNTAS[i];

  registrar("resposta", { etapa: i + 1, pergunta: p.q, resposta: opt.t });
  track("QuizStep", { step: i + 1 });

  if(opt.bloqueia){
    registrar("bloqueado_menor", { etapa: i + 1 });
    track("QuizBlockedUnder18", {});
    elP.textContent = "Conteúdo apenas para maiores de 18 anos";
    elO.innerHTML = '<p class="msg">Não é possível continuar.</p>';
    return;
  }

  if(opt.avanca){
    registrar("concluiu", {});
    registrar("clique_cta", {});
    track("QuizComplete", {});
    track("QuizCTAClick", {});
    window.location.href = destino();
    return;
  }

  i++;
  render();
}

registrar("iniciou", {});
render();
</script>
</body>
</html>
